# SonarQube Project Configuration
# Hospital Management System - Static Code Analysis

# Project identification
sonar.projectKey=hospital-management-system
sonar.projectName=Hospital Management System
sonar.projectVersion=1.0.0
sonar.organization=hospital-org

# Source code location
sonar.sources=src
sonar.tests=test

# Java version
sonar.java.source=1.8
sonar.java.target=1.8

# Encoding
sonar.sourceEncoding=UTF-8

# Binary directories
sonar.java.binaries=build/classes
sonar.java.test.binaries=build/test-classes

# Libraries
sonar.java.libraries=lib/*.jar

# Exclusions
sonar.exclusions=**/build/**,**/dist/**,**/*.jar
sonar.test.exclusions=test/**

# Coverage (if using JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=sonarqube/reports/jacoco.xml

# Test reports
sonar.junit.reportPaths=sonarqube/reports/junit
sonar.surefire.reportsPath=sonarqube/reports/surefire-reports

# Additional settings
sonar.verbose=true
sonar.log.level=INFO

# Code analysis parameters
sonar.cpd.java.minimumtokens=100
sonar.issue.ignore.multicriteria=e1,e2

# Ignore TODOs
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.java

# Ignore print statements in debug code
sonar.issue.ignore.multicriteria.e2.ruleKey=java:S106
sonar.issue.ignore.multicriteria.e2.resourceKey=**/TestRunner.java
